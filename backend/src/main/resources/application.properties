spring.application.name=quiz-platform

# ---- Database (PostgreSQL) ----
# Local dev uses the defaults below. In production (Render, etc.), set the
# DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD environment variables
# and they will override these defaults automatically - no code change needed.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quizplatform}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ---- Server ----
# Render (and most PaaS hosts) inject their own PORT env var at runtime.
server.port=${PORT:8080}

# ---- JWT ----
# 256-bit+ secret used to sign tokens. Set JWT_SECRET as an env var in
# production - never rely on the fallback default outside local dev.
app.jwt.secret=${JWT_SECRET:ChangeThisSuperSecretQuizPlatformJwtSigningKey1234567890!!}
app.jwt.expiration-ms=86400000

# ---- CORS ----
# Set to your deployed frontend URL (e.g. https://your-app.vercel.app) via
# the CORS_ALLOWED_ORIGINS env var in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Default Admin (created on startup if no admin exists) ----
app.admin.name=${ADMIN_NAME:Super Admin}
app.admin.email=${ADMIN_EMAIL:admin@quizplatform.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}